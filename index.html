<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore marble mandir designs, workshop details and custom enquiry options from Bharadwaj Mandir." />
    <meta property="og:title" content="Bharadwaj Mandir | Marble Mandir Designs" />
    <meta property="og:description" content="Explore marble mandir designs, workshop details and custom enquiry options from Bharadwaj Mandir." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Bharadwaj Mandir | Marble Mandir Designs" />
    <meta name="twitter:description" content="Explore marble mandir designs, workshop details and custom enquiry options from Bharadwaj Mandir." />
    <title>Bharadwaj Mandir | Marble Mandir Designs</title>
  </head>
  <body>
    <form name="enquiry" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="enquiry" />
      <input name="bot-field" />
      <input name="fullName" />
      <input name="email" />
      <input name="country" />
      <input name="city" />
      <input name="phone" />
      <input name="buyerType" />
      <input name="interest" />
      <input name="dimensions" />
      <input name="budget" />
      <input name="timeline" />
      <input name="deliveryNeeds" />
      <textarea name="message"></textarea>
      <input type="file" name="referenceFile" />
      <input name="privacyAcknowledged" />
      <input name="marketingConsent" />
      <input name="productId" />
      <input name="productUrl" />
      <input name="pageUrl" />
      <input name="landingPage" />
      <input name="utm_source" />
      <input name="utm_medium" />
      <input name="utm_campaign" />
      <input name="utm_term" />
      <input name="utm_content" />
    </form>
    <div id="root">
      <main class="home-page">
        <section class="hero-section">
          <div class="hero-inner hero-inner-photo">
            <div class="hero-copy">
              <p class="eyebrow">Bharadwaj Mandir <span class="eyebrow-rule"></span></p>
              <h1><span>Marble mandirs,</span><span>made personal.</span></h1>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
